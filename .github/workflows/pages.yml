# Publishes the project site to GitHub Pages. The settings page goes to /app/, where it works as the Bluetooth app (Web Bluetooth needs HTTPS)
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/assets/icon.svg, firmware/web/index.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/app
          cp site/index.html docs/assets/icon.svg _site/
          cp firmware/web/index.html _site/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
