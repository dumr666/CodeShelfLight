; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
lib_deps =
	adafruit/Adafruit NeoPixel@^1.15.5
	h2zero/NimBLE-Arduino@^2.3.0
	bblanchon/ArduinoJson@^7.2.0
; web/index.html -> include/webpage.h
extra_scripts = pre:scripts/embed_web.py

; Upload over WiFi: pio run -e ota -t upload
; If secrets.h has OTA_PASSWORD, add: upload_flags = --auth=<password>
; If you rename the light, update the address here (<name>.local) or use the IP
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = codeshelf-light.local
