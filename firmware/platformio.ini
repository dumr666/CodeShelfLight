; CodeShelf Light firmware. Build: pio run   Flash over USB: pio run -t upload
; Docs: ../docs/firmware.md

[platformio]
default_envs = esp32s3

; Waveshare ESP32-S3-Zero (4 MB flash, WS2812 on GPIO21). Other ESP32-S3 boards work with
; a different LED_PIN; LED_COUNT > 1 drives a strip in one color.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DLED_PIN=21
	-DLED_COUNT=1
lib_deps =
	adafruit/Adafruit NeoPixel@^1.15.5
	h2zero/NimBLE-Arduino@^2.3.0
	bblanchon/ArduinoJson@^7.2.0
; embed_web: web/index.html -> include/webpage.h before the build
; package: .pio/build/<env>/package/ with flash.json and images for the setup app
extra_scripts =
	pre:scripts/embed_web.py
	post:scripts/package.py

; Upload over WiFi: pio run -e ota -t upload --upload-port <name>.local
; With an admin password set on the light, add: upload_flags = --auth=<password>
[env:ota]
extends = env:esp32s3
upload_protocol = espota
